<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Arcade</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .arcade-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .game-card {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            width: 250px;
            padding: 15px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #007bff;
        }
        .game-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .game-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>🎮Le Arcade🕹️</h1>
    <p>Click any game below to open it in a new tab and start playing</p>

    <div class="arcade-container">

        <!-- Game 1: My game -->
        <div class="game-card">
            <h3>Vigil Remnants</h3>
            <p>Test 1</p>
            <a href="letiolan.github.io/vigil/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="game-link">Play Game</a>
        </div>

        <!-- Game 2: Kaedyns Game -->
        <div class="game-card">
            <h3>Tower Defense</h3>
            <p>Test 2</p>
            <a href="https://bioshrimpcoding.github.io/TowerDefense-1/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="game-link">Play Game</a>
        </div>

    </div>

</body>
</html>
